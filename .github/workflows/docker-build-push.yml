name: Build & Push DealWallet Scrapy

on:
  push:
    branches:
      - celery_beat_reddis

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:

    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: celery_beat_reddis

      # --------------------------------------------------
      # Dynamic image tag
      # --------------------------------------------------

      - name: Set image tag
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Login to GHCR
      # --------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # --------------------------------------------------
      # Build & Push Docker Image
      # --------------------------------------------------

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dealwallet1/dealwallet-scrapy:${{ steps.vars.outputs.sha_short }}
            ghcr.io/dealwallet1/dealwallet-scrapy:latest

      # --------------------------------------------------
      # Update All Kubernetes Image References
      # --------------------------------------------------

      - name: Update Kubernetes Images
        run: |
          NEW_IMAGE="ghcr.io/dealwallet1/dealwallet-scrapy:${{ steps.vars.outputs.sha_short }}"

          grep -rl \
            "image: ghcr.io/dealwallet1/dealwallet-scrapy:" \
            k8s \
            --include="*.yaml" \
            | xargs sed -i \
            "s|image: ghcr.io/dealwallet1/dealwallet-scrapy:.*|image: ${NEW_IMAGE}|g"

      # --------------------------------------------------
      # Verify Images
      # --------------------------------------------------

      - name: Verify Kubernetes Images
        run: |
          echo "Updated Kubernetes images:"

          grep -R \
            "image: ghcr.io/dealwallet1/dealwallet-scrapy:" \
            k8s \
            --include="*.yaml"

      # --------------------------------------------------
      # Commit & Push Updated Manifests
      # --------------------------------------------------

      - name: Commit & Push Updated Manifests
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add k8s/*.yaml

          if git diff --staged --quiet; then
            echo "No Kubernetes image changes to commit"
            exit 0
          fi

          git commit \
            -m "Update image tag to ${{ steps.vars.outputs.sha_short }}"

          git fetch origin celery_beat_reddis

          git rebase origin/celery_beat_reddis

          git push origin HEAD:celery_beat_reddis