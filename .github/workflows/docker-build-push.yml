name: Build & Push DealWallet Scrapy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    # Prevent workflow from running again
    # when GitHub Actions updates deployment.yaml
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # --------------------------------------------------
      # Dynamic image tag
      # --------------------------------------------------

      - name: Set image tag
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Login to GHCR
      # --------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # --------------------------------------------------
      # Build & Push Docker Image
      # --------------------------------------------------

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dealwallet1/dealwallet-scrapy:${{ steps.vars.outputs.sha_short }}
            ghcr.io/dealwallet1/dealwallet-scrapy:latest

      # --------------------------------------------------
      # Update Deployment Image
      # --------------------------------------------------

      - name: Update Deployment Image
        run: |
          sed -i "s|image: ghcr.io/dealwallet1/dealwallet-scrapy:.*|image: ghcr.io/dealwallet1/dealwallet-scrapy:${{ steps.vars.outputs.sha_short }}|g" k8s/deployment.yaml

      # --------------------------------------------------
      # Verify Updated Image
      # --------------------------------------------------

      - name: Verify Deployment Image
        run: |
          echo "Updated deployment image:"
          grep "image:" k8s/deployment.yaml

      # --------------------------------------------------
      # Commit & Push Updated Manifest
      # --------------------------------------------------

      - name: Commit & Push Updated Manifest
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          if git diff --staged --quiet; then
            echo "No deployment changes to commit"
            exit 0
          fi

          git commit -m "Update image tag to ${{ steps.vars.outputs.sha_short }}"

          # Get latest remote changes
          git fetch origin main

          # Rebase our commit on latest main
          git rebase origin/main

          # Push rebased commit
          git push origin HEAD:main
