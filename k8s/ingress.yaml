apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: dealwallet-scrapyd

  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/redirect-entry-point: https

spec:
  rules:
    - host: celery-scrapy.dbinfo.dpdns.org

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: dealwallet-scrapyd
                port:
                  number: 4079

  tls:
    - hosts:
        - celery-scrapy.dbinfo.dpdns.org
