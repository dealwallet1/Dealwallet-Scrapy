apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealwallet-scrapyd
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: dealwallet-scrapyd

  template:
    metadata:
      labels:
        app: dealwallet-scrapyd

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: dealwallet-scrapyd

          image: ghcr.io/dealwallet1/dealwallet-scrapy:0b885ff
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 6800
              protocol: TCP

          env:
            - name: TZ
              value: "Asia/Kolkata"

          envFrom:
            - secretRef:
                name: dealwallet-scrapy-secret

          volumeMounts:
            - name: dealwallet-scrapyd-storage
              mountPath: /var/lib/scrapyd

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "4Gi"

      volumes:
        - name: dealwallet-scrapyd-storage
          persistentVolumeClaim:
            claimName: dealwallet-scrapyd-pvc
