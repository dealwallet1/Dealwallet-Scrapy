apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealwallet-scrapyd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dealwallet-scrapyd
  template:
    metadata:
      labels:
        app: dealwallet-scrapyd
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: dealwallet-scrapyd

          image: ghcr.io/dealwallet1/dealwallet-scrapy:9996d28
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 6800
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Kolkata
          envFrom:
            - secretRef:
                name: dealwallet-scrapy-secret
          volumeMounts:
            - name: dealwallet-scrapyd-storage
              mountPath: /var/lib/scrapyd
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "4Gi"
      volumes:
        - name: dealwallet-scrapyd-storage
          persistentVolumeClaim:
            claimName: dealwallet-scrapyd-pvc


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealwallet-scheduler
spec:
  replicas: 1

  selector:
    matchLabels:
      app: dealwallet-scheduler

  template:
    metadata:
      labels:
        app: dealwallet-scheduler

    spec:
      containers:
        - name: dealwallet-scheduler
          image: ghcr.io/dealwallet1/dealwallet-scrapy:9996d28
          imagePullPolicy: Always

          command:
            - python

          args:
            - scheduler.py

          envFrom:
            - secretRef:
                name: dealwallet-scrapy-secret

          env:
            - name: TZ
              value: Asia/Kolkata

            - name: SCRAPYD_URL
              value: "http://dealwallet-scrapyd:4079"

            - name: SCRAPYD_PROJECT
              value: "dealwallet_scraper"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"
            claimName: dealwallet-scrapyd-pvc
