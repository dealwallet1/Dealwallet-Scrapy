apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealwallet-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealwallet-redis
  template:
    metadata:
      labels:
        app: dealwallet-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dealwallet-redis
spec:
  type: ClusterIP
  selector:
    app: dealwallet-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379